name: ez_core
description: "Инфраструктура приложения: строки интерфейса, локаль и очередь задач."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Только правила языка (склонение по числу): строки интерфейса и речь
  # Джарвиса склоняют одним правилом. Продуктовое из домена сюда не берётся.
  ez_domain:
    path: ../ez_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

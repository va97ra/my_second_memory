name: ezhednevnik_v2
description: Local-first mobile memory app with dated items, voice notes, reminders, and a smart feed.
publish_to: "none"

# В RuStore опубликовано 1.0.6(7); здесь готовится следующая версия.
# Не поднимать, пока эта не выложена: до публикации меняется она сама, а не
# номер за ней.
version: 1.0.9+10

# Модули приложения. Границы между слоями держит сборка:
# чего нет в dependencies пакета, то он импортировать не может.
workspace:
  - packages/ez_core
  - packages/ez_data
  - packages/ez_design
  - packages/ez_domain

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ez_core:
    path: packages/ez_core
  ez_data:
    path: packages/ez_data
  ez_design:
    path: packages/ez_design
  ez_domain:
    path: packages/ez_domain
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  record: ^7.1.1
  just_audio: ^0.9.40
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.3.1
  file_selector: ^1.0.3
  cryptography: ^2.7.0
  supabase_flutter: ^2.16.0
  image_picker: ^1.2.3
  archive: ^4.0.9
  launch_at_startup: ^0.5.1
  screen_retriever: ^0.2.2
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  windows_single_instance: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.12
  drift_dev: ^2.20.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/textures/notebook_wood.webp
    - assets/textures/notebook_paper.webp
    - assets/textures/notebook_paper_grain.webp
    - assets/textures/notebook_leather_contrast.png
    - assets/textures/dark_wood.webp
    - assets/textures/dark_paper.webp
    - assets/textures/dark_leather.webp
    - assets/textures/light_wood.webp
    - assets/textures/light_paper.webp
    - assets/textures/light_leather.webp
    - assets/textures/vacation_ribbon.webp
    - windows/runner/resources/app_icon.ico
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
    - family: Lifehack
      fonts:
        - asset: assets/fonts/ofont.ru_Lifehack.ttf
    - family: PatsySans
      fonts:
        - asset: "assets/fonts/ofont.ru_Patsy Sans.otf"

name: ezhednevnik_v2
description: Local-first mobile memory app with dated items, voice notes, reminders, and a smart feed.
publish_to: "none"

# Опубликованная и готовящаяся версии описаны в 00_READ_THIS_FIRST.md.
# Не поднимать, пока эта не выложена: до публикации меняется она сама, а не
# номер за ней.
version: 1.2.0+14

# Модули приложения. Границы между слоями держит сборка:
# чего нет в dependencies пакета, то он импортировать не может.
workspace:
  - packages/ez_core
  - packages/ez_data
  - packages/ez_design
  - packages/ez_domain

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ez_core:
    path: packages/ez_core
  ez_data:
    path: packages/ez_data
  ez_design:
    path: packages/ez_design
  ez_domain:
    path: packages/ez_domain
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  record: ^7.1.1
  # Джарвис: распознавание речи на телефоне без сети (sherpa-onnx + модель
  # Vosk small ru) и голос дворецкого. Версии — те, что проверены на телефоне
  # владельца в MemoryVoice.
  sherpa_onnx: 1.13.8
  flutter_tts: 4.2.5
  just_audio: ^0.9.40
  # Проигрывателя для Windows у just_audio нет: он объявляет только android,
  # ios, macos и web. Без этой реализации нажатие на голосовую заметку на
  # настольной версии молча ничего не делало.
  just_audio_windows: ^0.2.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.3.1
  file_selector: ^1.0.3
  cryptography: ^2.7.0
  supabase_flutter: ^2.16.0
  image_picker: ^1.2.3
  archive: ^4.0.9
  launch_at_startup: ^0.5.1
  screen_retriever: ^0.2.2
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  windows_single_instance: ^1.1.0

dev_dependencies:
  http: ^1.2.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.12
  drift_dev: ^2.20.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/textures/notebook_wood.webp
    - assets/textures/notebook_paper.webp
    - assets/textures/notebook_paper_grain.webp
    - assets/textures/notebook_leather_contrast.png
    - assets/textures/dark_wood.webp
    - assets/textures/dark_paper.webp
    - assets/textures/dark_leather.webp
    - assets/textures/light_wood.webp
    - assets/textures/light_paper.webp
    - assets/textures/light_leather.webp
    - assets/textures/vacation_ribbon.webp
    - assets/textures/cosmos_backdrop.webp
    - assets/textures/cyberpunk_city_street.webp
    # Офлайн-распознавание речи Джарвиса: Vosk small streaming ru 0.54,
    # Apache 2.0 (alphacep/vosk-model-small-streaming-ru).
    - assets/speech/vosk-ru/
    - windows/runner/resources/app_icon.ico
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
    - family: Lifehack
      fonts:
        - asset: assets/fonts/ofont.ru_Lifehack.ttf
    - family: PatsySans
      fonts:
        - asset: "assets/fonts/ofont.ru_Patsy Sans.otf"
    # Шрифты для текста записей и панели оформления — с русскими буквами,
    # SIL Open Font License (лицензии рядом: assets/fonts/OFL-*.txt).
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
    - family: PTSerif
      fonts:
        - asset: assets/fonts/PTSerif-Regular.ttf
        - asset: assets/fonts/PTSerif-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
    - family: PTSans
      fonts:
        - asset: assets/fonts/PTSans-Regular.ttf
        - asset: assets/fonts/PTSans-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Variable.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
    - family: MarckScript
      fonts:
        - asset: assets/fonts/MarckScript-Regular.ttf
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-Variable.ttf
    - family: PTMono
      fonts:
        - asset: assets/fonts/PTMono-Regular.ttf
